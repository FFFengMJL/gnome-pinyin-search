name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Matcher checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install GJS
        run: |
          sudo apt-get update
          sudo apt-get install -y gjs

      - name: Run checks
        run: make check
