name: Bug report
description: Report a crash, wrong search result, or installation problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please include enough
        detail to reproduce it.

  - type: input
    id: gnome-version
    attributes:
      label: GNOME Shell version
      description: Output of `gnome-shell --version`.
      placeholder: "50.6"
    validations:
      required: true

  - type: input
    id: distro
    attributes:
      label: Distribution and version
      placeholder: "Fedora 44"
    validations:
      required: true

  - type: dropdown
    id: session
    attributes:
      label: Session type
      options:
        - Wayland
        - X11
    validations:
      required: true

  - type: input
    id: extension-version
    attributes:
      label: Extension version
      description: From `metadata.json`, for example `0.1.0` or commit hash.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press Super
        2. Type `shezhi`
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Run `journalctl --user -b | grep pinyin-app-search` and paste the
        relevant output.
      render: shell
