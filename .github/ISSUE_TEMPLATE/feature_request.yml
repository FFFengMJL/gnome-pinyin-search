name: Feature request
description: Suggest a new matching rule, provider, or workflow improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the proposed solution. Small,
        focused suggestions are easiest to evaluate.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, or what is awkward?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it behave?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing extensions, workarounds, or other approaches.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: GNOME Shell version, distribution, screenshots, links.
